<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar &amp; Tasks</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-theme="dark">

<div class="app-container">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">

        <!-- Mini Calendar -->
        <div class="sidebar-section">
            <div class="mini-cal" id="mini-cal"></div>
        </div>

        <!-- Navigation -->
        <div class="sidebar-section">
            <nav class="nav-list">
                <button class="nav-item active" data-view="calendar">
                    <span class="nav-icon">&#128197;</span>
                    <span>Calendar</span>
                </button>
                <button class="nav-item" data-view="tasks">
                    <span class="nav-icon">&#9989;</span>
                    <span>Tasks</span>
                </button>
                <button class="nav-item" data-view="notes">
                    <span class="nav-icon">&#128221;</span>
                    <span>Notes</span>
                </button>
                <button class="nav-item" data-view="mail">
                    <span class="nav-icon">&#128231;</span>
                    <span>Mail</span>
                </button>
            </nav>
        </div>

        <!-- Theme Selector -->
        <div class="sidebar-section">
            <div class="theme-row">
                <label for="theme-select">Theme</label>
                <select id="theme-select">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
        </div>

        <!-- Integrations -->
        <div class="sidebar-section" id="integrations-section">
            <div class="integration-section" id="integration-list">
                <h4>Integrations</h4>
                <button class="int-btn" id="int-google">
                    <span class="status-dot"></span>
                    <span>Google</span>
                </button>
                <button class="int-btn" id="int-microsoft">
                    <span class="status-dot"></span>
                    <span>Microsoft</span>
                </button>
                <button class="int-btn sync-btn" id="sync-gcal" style="display:none">
                    Sync Google Calendar
                </button>
                <button class="int-btn sync-btn" id="sync-outlook" style="display:none">
                    Sync Outlook Calendar
                </button>
            </div>
        </div>

        <!-- User Section -->
        <div class="sidebar-section" id="user-section">
            <div id="user-area"></div>
        </div>

    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main-content" id="main-content">

        <!-- ===== CALENDAR VIEW ===== -->
        <div class="view active" id="view-calendar">
            <div class="view-header">
                <div class="cal-nav">
                    <button class="btn-icon" id="cal-prev" title="Previous month">&#9664;</button>
                    <span class="month-label" id="cal-month-label"></span>
                    <button class="btn-icon" id="cal-next" title="Next month">&#9654;</button>
                    <button class="btn-secondary" id="cal-today">Today</button>
                </div>
                <div class="view-header-actions">
                    <button class="btn-primary" id="btn-new-event">+ New Event</button>
                </div>
            </div>
            <div class="cal-body">
                <div class="cal-grid" id="cal-grid"></div>
            </div>
        </div>

        <!-- ===== TASKS VIEW ===== -->
        <div class="view" id="view-tasks">
            <div class="view-header">
                <h1>Tasks</h1>
                <div class="view-header-actions">
                    <button class="btn-primary" id="btn-new-task">+ New Task</button>
                </div>
            </div>
            <div class="tasks-body">
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <div class="task-sort">
                        <label for="task-sort">Sort:</label>
                        <select id="task-sort">
                            <option value="due-date">Due Date</option>
                            <option value="priority">Priority</option>
                            <option value="created">Created</option>
                        </select>
                    </div>
                </div>
                <div class="task-list" id="task-list"></div>
            </div>
        </div>

        <!-- ===== NOTES VIEW ===== -->
        <div class="view" id="view-notes">
            <div class="view-header">
                <h1>Notes</h1>
                <div class="view-header-actions">
                    <button class="btn-primary" id="btn-new-note">+ New Note</button>
                </div>
            </div>
            <div class="notes-body">
                <div class="notes-search">
                    <input type="text" id="notes-search" placeholder="Search notes...">
                </div>
                <div class="notes-grid" id="notes-grid"></div>
            </div>
        </div>

        <!-- ===== MAIL VIEW ===== -->
        <div class="view" id="view-mail">
            <div class="view-header">
                <h1>Mail</h1>
                <div class="view-header-actions">
                    <button class="btn-primary" id="btn-compose">+ Compose</button>
                </div>
            </div>
            <div class="mail-tabs" id="mail-tabs">
                <button class="mail-tab active" data-mail-tab="inbox">Inbox</button>
                <button class="mail-tab" data-mail-tab="sent">Sent</button>
            </div>
            <div class="mail-body">
                <div class="mail-list" id="mail-list"></div>
            </div>
        </div>

    </main>
</div>

<!-- ===== MOBILE BOTTOM NAV ===== -->
<nav class="mobile-nav" id="mobile-nav">
    <button class="nav-item active" data-view="calendar">
        <span class="nav-icon">&#128197;</span>
        <span>Calendar</span>
    </button>
    <button class="nav-item" data-view="tasks">
        <span class="nav-icon">&#9989;</span>
        <span>Tasks</span>
    </button>
    <button class="nav-item" data-view="notes">
        <span class="nav-icon">&#128221;</span>
        <span>Notes</span>
    </button>
    <button class="nav-item" data-view="mail">
        <span class="nav-icon">&#128231;</span>
        <span>Mail</span>
    </button>
</nav>

<!-- ===== CONTEXT MENU ===== -->
<div class="context-menu" id="context-menu"></div>

<!-- ===== TOAST CONTAINER ===== -->
<div class="toast-container" id="toast-container"></div>

<!-- ===================== MODALS ===================== -->

<!-- AUTH MODAL -->
<div class="modal-overlay" id="modal-auth">
    <div class="modal-dialog">
        <div class="modal-header">
            <h2>Sign In</h2>
            <button class="modal-close-btn" data-close="modal-auth">&#10005;</button>
        </div>
        <div class="modal-body">
            <div class="auth-providers">
                <button class="provider-btn google" id="btn-google-auth">
                    <span class="provider-icon">&#128308;</span>
                    Continue with Google
                </button>
                <button class="provider-btn microsoft" id="btn-ms-auth">
                    <span class="provider-icon">&#128309;</span>
                    Continue with Microsoft
                </button>
            </div>
            <div class="divider">or sign in with email</div>
            <form id="email-auth-form">
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="Password" required autocomplete="current-password">
                </div>
                <div class="modal-footer" style="padding:0">
                    <button type="submit" class="btn-primary" id="btn-email-auth">Sign In / Register</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- EVENT MODAL -->
<div class="modal-overlay" id="modal-event">
    <div class="modal-dialog wide">
        <div class="modal-header">
            <h2 id="event-modal-title">New Event</h2>
            <button class="modal-close-btn" data-close="modal-event">&#10005;</button>
        </div>
        <div class="modal-body">
            <form id="event-form">
                <input type="hidden" id="event-id">
                <div class="form-group">
                    <label for="event-title">Title</label>
                    <input type="text" id="event-title" placeholder="Add title" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Description</label>
                    <textarea id="event-description" placeholder="Add description"></textarea>
                </div>
                <div class="form-group">
                    <label for="event-location">Location</label>
                    <input type="text" id="event-location" placeholder="Add location">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="event-start">Start</label>
                        <input type="datetime-local" id="event-start" required>
                    </div>
                    <div class="form-group">
                        <label for="event-end">End</label>
                        <input type="datetime-local" id="event-end" required>
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="event-all-day">
                    <label for="event-all-day">All day</label>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Color</label>
                        <div class="color-picker-row" id="event-color-picker"></div>
                        <input type="hidden" id="event-color" value="#60cdff">
                    </div>
                    <div class="form-group">
                        <label for="event-reminder">Reminder</label>
                        <select id="event-reminder">
                            <option value="0">None</option>
                            <option value="5">5 minutes</option>
                            <option value="15" selected>15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="60">1 hour</option>
                            <option value="1440">1 day</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="event-recurrence">Recurrence</label>
                    <select id="event-recurrence">
                        <option value="">None</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="btn-event-delete" style="display:none;margin-right:auto">Delete</button>
            <button class="btn-secondary" data-close="modal-event">Cancel</button>
            <button class="btn-primary" id="btn-event-save">Save</button>
        </div>
    </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="modal-task">
    <div class="modal-dialog">
        <div class="modal-header">
            <h2 id="task-modal-title">New Task</h2>
            <button class="modal-close-btn" data-close="modal-task">&#10005;</button>
        </div>
        <div class="modal-body">
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" placeholder="Task title" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" placeholder="Add details"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-due">Due Date</label>
                        <input type="date" id="task-due">
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="0">Low</option>
                            <option value="1" selected>Medium</option>
                            <option value="2">High</option>
                            <option value="3">Urgent</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="task-category">Category</label>
                    <input type="text" id="task-category" placeholder="e.g. Work, Personal">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="btn-task-delete" style="display:none;margin-right:auto">Delete</button>
            <button class="btn-secondary" data-close="modal-task">Cancel</button>
            <button class="btn-primary" id="btn-task-save">Save</button>
        </div>
    </div>
</div>

<!-- NOTE MODAL -->
<div class="modal-overlay" id="modal-note">
    <div class="modal-dialog">
        <div class="modal-header">
            <h2 id="note-modal-title">New Note</h2>
            <button class="modal-close-btn" data-close="modal-note">&#10005;</button>
        </div>
        <div class="modal-body">
            <form id="note-form">
                <input type="hidden" id="note-id">
                <div class="form-group">
                    <label for="note-title">Title</label>
                    <input type="text" id="note-title" placeholder="Title">
                </div>
                <div class="form-group">
                    <label for="note-content">Content</label>
                    <textarea id="note-content" placeholder="Write your note..." rows="8"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Color</label>
                        <div class="color-picker-row" id="note-color-picker"></div>
                        <input type="hidden" id="note-color" value="#ffffff">
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div class="form-check" style="margin:10px 0 0">
                            <input type="checkbox" id="note-pinned">
                            <label for="note-pinned">Pin to top</label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="btn-note-delete" style="display:none;margin-right:auto">Delete</button>
            <button class="btn-secondary" data-close="modal-note">Cancel</button>
            <button class="btn-primary" id="btn-note-save">Save</button>
        </div>
    </div>
</div>

<!-- COMPOSE MAIL MODAL -->
<div class="modal-overlay" id="modal-compose">
    <div class="modal-dialog wide">
        <div class="modal-header">
            <h2>Compose</h2>
            <button class="modal-close-btn" data-close="modal-compose">&#10005;</button>
        </div>
        <div class="modal-body">
            <form id="compose-form">
                <div class="form-group">
                    <label for="compose-to">To</label>
                    <input type="email" id="compose-to" placeholder="recipient@example.com" required>
                </div>
                <div class="form-group">
                    <label for="compose-subject">Subject</label>
                    <input type="text" id="compose-subject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <label for="compose-body">Message</label>
                    <textarea id="compose-body" placeholder="Write your message..." rows="10" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="compose-provider">Provider</label>
                        <select id="compose-provider">
                            <option value="gmail">Gmail</option>
                            <option value="outlook">Outlook</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" data-close="modal-compose">Discard</button>
            <button class="btn-primary" id="btn-send-mail">Send</button>
        </div>
    </div>
</div>

<!-- READ MAIL MODAL -->
<div class="modal-overlay" id="modal-read-mail">
    <div class="modal-dialog wide">
        <div class="modal-header">
            <h2>Message</h2>
            <button class="modal-close-btn" data-close="modal-read-mail">&#10005;</button>
        </div>
        <div class="modal-body" id="read-mail-body"></div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
